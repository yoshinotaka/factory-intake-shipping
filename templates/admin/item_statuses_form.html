{% extends "base.html" %}

{% block title %}{% if status %}商品状態編集{% else %}商品状態作成{% endif %} - {{ app_name }}{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col-md-6">
        <h1>{% if status %}商品状態編集{% else %}商品状態作成{% endif %}</h1>
    </div>
    <div class="col-md-6 text-end">
        <a href="{{ url_for('admin.item_statuses_list') }}" class="btn btn-secondary">一覧に戻る</a>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="status_code" class="form-label">状態コード <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="status_code" name="status_code"
                               value="{{ status.status_code if status else '' }}" required
                               placeholder="例: received, shipped">
                        <small class="form-text text-muted">状態を識別するコード（英数字、アンダースコア、ハイフン使用可）</small>
                    </div>

                    <div class="mb-3">
                        <label for="status_name" class="form-label">状態名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="status_name" name="status_name"
                               value="{{ status.status_name if status else '' }}" required
                               placeholder="例: 入荷, 出荷済">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">説明</label>
                        <textarea class="form-control" id="description" name="description" rows="3"
                                  placeholder="状態の説明（任意）">{{ status.description if status else '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="display_order" class="form-label">表示順序</label>
                                <input type="number" class="form-control" id="display_order" name="display_order"
                                       value="{{ status.display_order if status else 0 }}" min="0">
                                <small class="form-text text-muted">数値が小さいほど先に表示されます</small>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="mb-3 form-check" style="margin-top: 2.5rem;">
                                <input type="checkbox" class="form-check-input" id="is_active" name="is_active"
                                       {% if not status or status.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">
                                    アクティブ（有効）
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-secondary">
                            {% if status %}更新{% else %}作成{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
