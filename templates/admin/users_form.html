{% extends "base.html" %}

{% block title %}{% if user %}ユーザー編集{% else %}ユーザー作成{% endif %} - {{ app_name }}{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col-md-6">
        <h1>{% if user %}ユーザー編集{% else %}ユーザー作成{% endif %}</h1>
    </div>
    <div class="col-md-6 text-end">
        <a href="{{ url_for('admin.users_list') }}" class="btn btn-secondary">一覧に戻る</a>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">ユーザー名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ user.username if user else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">メールアドレス</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ user.email if user else '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            パスワード
                            {% if user %}
                                <small class="text-muted">（変更する場合のみ入力）</small>
                            {% else %}
                                <span class="text-danger">*</span>
                            {% endif %}
                        </label>
                        <input type="password" class="form-control" id="password" name="password"
                               {% if not user %}required{% endif %}>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_admin" name="is_admin"
                               {% if user and user.is_admin %}checked{% endif %}>
                        <label class="form-check-label" for="is_admin">
                            管理者権限を付与
                        </label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_store_staff" name="is_store_staff"
                               {% if user and user.is_store_staff %}checked{% endif %}>
                        <label class="form-check-label" for="is_store_staff">
                            店舗スタッフ権限を付与
                        </label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_factory_staff" name="is_factory_staff"
                               {% if user and user.is_factory_staff %}checked{% endif %}>
                        <label class="form-check-label" for="is_factory_staff">
                            工場スタッフ権限を付与
                        </label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_shift_staff" name="is_shift_staff"
                               {% if user and user.is_shift_staff %}checked{% endif %}>
                        <label class="form-check-label" for="is_shift_staff">
                            シフト作成スタッフ権限を付与
                        </label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_office_staff" name="is_office_staff"
                               {% if user and user.is_office_staff %}checked{% endif %}>
                        <label class="form-check-label" for="is_office_staff">
                            事務スタッフ権限を付与
                        </label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_active" name="is_active"
                               {% if not user or user.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">
                            アクティブ（有効）
                        </label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            {% if user %}更新{% else %}作成{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
