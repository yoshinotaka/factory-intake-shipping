{% extends "base.html" %}

{% block title %}機能一覧 - {{ app_name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h1>機能一覧</h1>
        <p class="lead">システムの主要機能をご紹介します</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">入荷管理</h5>
                <p class="card-text">CSV ファイルから入荷データを取り込みます</p>
                <a href="{{ url_for('intake.upload') }}" class="btn btn-primary">CSV アップロード</a>
                <a href="{{ url_for('intake.list_items') }}" class="btn btn-outline-primary mt-2">入荷一覧</a>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">出荷スキャン</h5>
                <p class="card-text">バーコードをスキャンして出荷登録</p>
                <a href="{{ url_for('shipping.index') }}" class="btn btn-primary">開く</a>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">未出荷一覧</h5>
                <p class="card-text">未出荷の商品を確認します</p>
                <a href="{{ url_for('status.unshipped') }}" class="btn btn-primary">開く</a>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">遅れ品管理</h5>
                <p class="card-text">予定日を過ぎた商品を管理</p>
                <a href="{{ url_for('status.delayed') }}" class="btn btn-danger">開く</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
