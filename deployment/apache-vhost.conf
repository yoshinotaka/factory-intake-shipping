# Apache Virtual Host 設定例
# 新・出荷システム (/fi/ 配下)
#
# インストール方法:
#   1. このファイルを /etc/httpd/conf.d/ にコピー
#   2. Apache を再起動: sudo systemctl restart httpd
#
# 必要なモジュール:
#   - mod_proxy
#   - mod_proxy_http (TCP の場合)
#   - mod_proxy_wstunnel (WebSocket の場合)
#
# モジュール有効化:
#   sudo yum install mod_ssl
#   sudo systemctl restart httpd

<VirtualHost *:80>
    ServerName example.com
    ServerAdmin admin@example.com

    # ログ設定
    ErrorLog /var/log/httpd/factory-shipping-error.log
    CustomLog /var/log/httpd/factory-shipping-access.log combined

    # 静的ファイル（オプション: Apache から直接配信する場合）
    Alias /fi/static /var/www/html/factory-intake-shipping/static
    <Directory /var/www/html/factory-intake-shipping/static>
        Require all granted
        Options -Indexes
    </Directory>

    # Gunicorn へのリバースプロキシ（Unix ソケット）
    ProxyPreserveHost On
    ProxyPass /fi/static !
    ProxyPass /fi unix:/var/www/html/factory-intake-shipping/gunicorn.sock|http://localhost/fi
    ProxyPassReverse /fi unix:/var/www/html/factory-intake-shipping/gunicorn.sock|http://localhost/fi

    # ヘッダー転送
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # タイムアウト設定
    ProxyTimeout 300

    # セキュリティヘッダー
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>

