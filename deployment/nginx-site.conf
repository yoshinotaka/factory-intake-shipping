# Nginx サイト設定例
# 新・出荷システム (/fi/ 配下)
#
# インストール方法:
#   1. このファイルを /etc/nginx/conf.d/ にコピー
#   2. Nginx の設定をテスト: sudo nginx -t
#   3. Nginx を再起動: sudo systemctl restart nginx

# Gunicorn へのアップストリーム定義
upstream factory_shipping {
    # Unix ソケットを使用（推奨）
    server unix:/var/www/html/factory-intake-shipping/gunicorn.sock fail_timeout=0;

    # TCP ポートを使用する場合
    # server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name example.com;

    # クライアント設定
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # タイムアウト設定
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ログ設定
    access_log /var/log/nginx/factory-shipping-access.log;
    error_log /var/log/nginx/factory-shipping-error.log;

    # 静的ファイル（Nginx から直接配信）
    location /fi/static/ {
        alias /var/www/html/factory-intake-shipping/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # アップロードファイル（認証が必要な場合はコメントアウト）
    # location /fi/uploads/ {
    #     alias /var/www/html/factory-intake-shipping/uploads/;
    #     internal;  # Flask から X-Accel-Redirect で制御
    # }

    # アプリケーション（Gunicorn へプロキシ）
    location /fi {
        proxy_pass http://factory_shipping;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket サポート（必要な場合）
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";

        # プロキシバッファ設定
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # リダイレクト処理
        proxy_redirect off;
    }

    # セキュリティヘッダー
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # robots.txt（オプション）
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }
}

